<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- BerlinX's icon: a Catppuccin Mocha panel on a cool gradient. On top, a
       tag with a bare attribute; below, what it renders as — a button, a
       toggle and an input. icon.png is this rendered at 1024px;
       scripts/icon.ps1 makes icon.ico from that. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94e2d5"/>
      <stop offset="0.5" stop-color="#74c7ec"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#11111b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#shine)"/>

  <!-- The panel -->
  <g filter="url(#lift)">
    <rect x="192" y="200" width="640" height="624" rx="72" fill="#1e1e2e"/>
  </g>

  <!-- <button primary> -->
  <g fill="none" stroke="#cba6f7" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 280 L248 316 L286 352"/>
    <path d="M738 280 L776 316 L738 352"/>
  </g>
  <rect x="316" y="300" width="164" height="32" rx="16" fill="#89b4fa"/>
  <rect x="504" y="300" width="204" height="32" rx="16" fill="#f9e2af"/>

  <rect x="248" y="412" width="528" height="8" rx="4" fill="#45475a"/>

  <!-- What it renders as: a button and a toggle... -->
  <rect x="248" y="484" width="312" height="112" rx="56" fill="#cba6f7"/>
  <rect x="324" y="528" width="160" height="24" rx="12" fill="#1e1e2e"/>
  <rect x="600" y="484" width="176" height="112" rx="56" fill="#a6e3a1"/>
  <circle cx="720" cy="540" r="40" fill="#fffdfc"/>

  <!-- ...and an input, its caret blinking -->
  <rect x="248" y="648" width="528" height="112" rx="32" fill="#313244"/>
  <rect x="292" y="676" width="12" height="56" rx="6" fill="#f5c2e7"/>
  <rect x="332" y="694" width="200" height="20" rx="10" fill="#585b70"/>

  <!-- Sparkle -->
  <path d="M840 120 C 846 164, 858 176, 902 182 C 858 188, 846 200, 840 244 C 834 200, 822 188, 778 182 C 822 176, 834 164, 840 120 Z" fill="#ffffff" fill-opacity="0.9"/>
</svg>
