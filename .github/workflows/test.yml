# Runs on every push and pull request: the build must reproduce the committed
# dist/ and guides exactly, and the element tests must pass in Chromium, Firefox
# and WebKit.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build, and check the committed output is current
        run: |
          npm run build
          git diff --exit-code -- dist '*.html'
          test -z "$(git status --porcelain -- dist)"

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
